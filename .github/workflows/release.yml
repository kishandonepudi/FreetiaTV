name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release artifacts
        env:
          FREETIA_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FREETIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FREETIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FREETIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleFossRelease bundleStoreRelease assembleStoreRelease --stacktrace

      - name: Collect artifacts and checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/foss/release/*.apk    "dist/FreetiaTV-${VERSION}-foss.apk"
          cp app/build/outputs/apk/store/release/*.apk   "dist/FreetiaTV-${VERSION}-store.apk"
          cp app/build/outputs/bundle/storeRelease/*.aab "dist/FreetiaTV-${VERSION}-store.aab"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Which file do I need?**
            - `FreetiaTV-*-foss.apk` — sideload on phones, Android TV and Fire TV (via the Downloader app). Includes a removable starter playlist.
            - `FreetiaTV-*-store.aab` / `-store.apk` — the store build (no bundled playlist).
            Verify downloads against `SHA256SUMS.txt`.
