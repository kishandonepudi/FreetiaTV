name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Quality gate (tests, brand, security, manifest — standards/RELEASE_GATE.md)
        run: bash scripts/quality-gate.sh

      - name: Lint
        run: gradle lintFossDebug

      - name: Assemble debug APK
        run: gradle assembleFossDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: freetia-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
